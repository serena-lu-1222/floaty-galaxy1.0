    <script>
        /**
         * 太空飄飄 Demo - 100% 離線永久保存版
         * 零外部網路連線依賴，採用原生 Web Audio API 合成音效、HTML5 Canvas 向量繪圖與 localStorage 永久存檔。
         */

        // ==========================================
        // 1. 原生 Web Audio API 音效合成器 (零外部依賴)
        // ==========================================
        class SoundManager {
            constructor() {
                this.enabled = true;
                this.ctx = null;
                this.noiseBuffer = null;
            }

            async init() {
                try {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (!AudioCtx) return;
                        this.ctx = new AudioCtx();
                        this.createNoiseBuffer();
                    }
                    if (this.ctx.state === 'suspended') {
                        await this.ctx.resume();
                    }
                } catch (e) {
                    console.warn("Audio init skipped:", e);
                }
            }

            createNoiseBuffer() {
                if (!this.ctx) return;
                const sampleRate = this.ctx.sampleRate;
                const length = sampleRate * 1.0;
                const buffer = this.ctx.createBuffer(1, length, sampleRate);
                const data = buffer.getChannelData(0);
                // 產生低頻濃厚的 Brown Noise 質感
                let lastOut = 0.0;
                for (let i = 0; i < length; i++) {
                    const white = Math.random() * 2 - 1;
                    data[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = data[i];
                    data[i] *= 3.5;
                }
                this.noiseBuffer = buffer;
            }

            playTone(freq, startTime, duration, type = 'triangle', peakGain = 0.16) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, startTime);

                // 模擬柔和包絡線 (attack: 0.02s, decay: 0.15s, release: 0.25s)
                gain.gain.setValueAtTime(0.0001, startTime);
                gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(peakGain * 0.35, startTime + Math.min(duration, 0.15));
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(startTime);
                osc.stop(startTime + duration + 0.28);
            }

            playNoise(startTime, duration = 0.25, peakGain = 0.28) {
                if (!this.ctx || !this.noiseBuffer) return;
                const source = this.ctx.createBufferSource();
                source.buffer = this.noiseBuffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(420, startTime);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.0001, startTime);
                gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration + 0.15);

                source.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                source.start(startTime);
                source.stop(startTime + duration + 0.18);
            }

            playHeal() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                // C5, E5, G5, C6
                this.playTone(523.25, now, 0.12, 'triangle', 0.16);
                this.playTone(659.25, now + 0.08, 0.12, 'triangle', 0.16);
                this.playTone(783.99, now + 0.16, 0.12, 'triangle', 0.16);
                this.playTone(1046.50, now + 0.24, 0.22, 'triangle', 0.18);
            }

            playHit() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                this.playNoise(now, 0.22, 0.32);
                // A2 (110Hz) & Eb2 (77.78Hz)
                this.playTone(110.00, now, 0.22, 'triangle', 0.22);
                this.playTone(77.78, now, 0.22, 'triangle', 0.22);
            }

            playFall() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                // G4, E4, C4, G3
                this.playTone(392.00, now, 0.18, 'triangle', 0.17);
                this.playTone(329.63, now + 0.15, 0.18, 'triangle', 0.17);
                this.playTone(261.63, now + 0.30, 0.18, 'triangle', 0.17);
                this.playTone(196.00, now + 0.45, 0.32, 'triangle', 0.18);
            }

            playStart() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                // E4, G4, B4
                this.playTone(329.63, now, 0.12, 'triangle', 0.16);
                this.playTone(392.00, now + 0.09, 0.12, 'triangle', 0.16);
                this.playTone(493.88, now + 0.18, 0.22, 'triangle', 0.18);
            }
        }

        const sound = new SoundManager();

        // ==========================================
        // 2. 角色高精度繪製系統 (100% 保留原有視覺設計)
        // ==========================================
        function drawAstronaut(ctx, astro) {
            ctx.save();
            ctx.translate(astro.x, astro.y);

            // 受傷無敵閃爍效果
            if (astro.alive && astro.invulnTimer > 0) {
                if (Math.floor(astro.invulnTimer * 16) % 2 === 0) {
                    ctx.globalAlpha = 0.45;
                }
            }

            // 失去三條命後的旋轉狀態
            if (!astro.alive) {
                ctx.rotate(astro.fallRotation);
            } else {
                ctx.rotate(astro.currentAngle || 0);
            }

            const s = astro.scale;
            ctx.scale(s, s);

            // 色彩線性插值輔助函式
            const darkenPct = !astro.alive ? Math.min(1, astro.grayProgress) : 0;
            const lerpHexColor = (hex1, hex2, t) => {
                if (t <= 0) return hex1;
                const r1 = parseInt(hex1.slice(1, 3), 16), g1 = parseInt(hex1.slice(3, 5), 16), b1 = parseInt(hex1.slice(5, 7), 16);
                const r2 = parseInt(hex2.slice(1, 3), 16), g2 = parseInt(hex2.slice(3, 5), 16), b2 = parseInt(hex2.slice(5, 7), 16);
                const r = Math.round(r1 + (r2 - r1) * t);
                const g = Math.round(g1 + (g2 - g1) * t);
                const b = Math.round(b1 + (b2 - b1) * t);
                return `rgb(${r}, ${g}, ${b})`;
            };

            // 配色定義 (完全依照原圖粉紅與淺藍配色)
            const isPink = astro.type === 'pink';
            const suitColor = lerpHexColor(isPink ? '#fbb6d3' : '#b9dcfa', '#6e7280', darkenPct);
            const highlightColor = lerpHexColor(isPink ? '#ffd4e6' : '#dcf0ff', '#8b90a0', darkenPct);
            const strokeColor = lerpHexColor('#9b8373', '#4a4852', darkenPct);
            const skinColor = lerpHexColor('#fff2df', '#8f8b88', darkenPct);
            const hairColor = lerpHexColor('#c3a17e', '#635c58', darkenPct);
            const cheekColor = lerpHexColor('#fbd0dc', '#7d777c', darkenPct);
            const bowColor = lerpHexColor('#f49cbb', '#66636e', darkenPct);

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 3.2;
            ctx.strokeStyle = strokeColor;

            // --- 1. 背後氧氣背包 ---
            ctx.fillStyle = suitColor;
            ctx.beginPath();
            ctx.roundRect(-34, -18, 68, 46, 16);
            ctx.fill();
            ctx.stroke();

            // --- 2. 左右手臂 ---
            const waveLeft = astro.alive ? Math.sin(astro.animTime * 3.5 + astro.phaseOffset) * 0.18 : 0.25;
            const waveRight = astro.alive ? Math.cos(astro.animTime * 3.5 + astro.phaseOffset) * 0.18 : -0.25;

            // 左手
            ctx.save();
            ctx.translate(-29, 4);
            ctx.rotate((isPink ? 0.35 : 0.15) + waveLeft);
            ctx.fillStyle = suitColor;
            ctx.beginPath();
            ctx.roundRect(-24, -10, 28, 22, 11);
            ctx.fill();
            ctx.stroke();
            // 袖口反光線
            ctx.strokeStyle = highlightColor;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(-14, -6);
            ctx.lineTo(-14, 7);
            ctx.stroke();
            ctx.restore();

            // 右手
            ctx.save();
            ctx.translate(29, 4);
            ctx.rotate((isPink ? -0.15 : -0.35) + waveRight);
            ctx.fillStyle = suitColor;
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.roundRect(-4, -10, 28, 22, 11);
            ctx.fill();
            ctx.stroke();
            // 袖口反光線
            ctx.strokeStyle = highlightColor;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(14, -6);
            ctx.lineTo(14, 7);
            ctx.stroke();
            ctx.restore();

            // --- 3. 身體與雙腿 (連身太空服) ---
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3.2;
            ctx.fillStyle = suitColor;

            ctx.beginPath();
            ctx.moveTo(-29, -4);
            ctx.quadraticCurveTo(-34, 18, -30, 38);
            // 左腿
            ctx.lineTo(-29, 55);
            ctx.quadraticCurveTo(-29, 64, -16, 64);
            ctx.quadraticCurveTo(-4, 64, -4, 54);
            ctx.lineTo(-4, 44);
            // 褲檔弧線
            ctx.quadraticCurveTo(0, 42, 4, 44);
            // 右腿
            ctx.lineTo(4, 54);
            ctx.quadraticCurveTo(4, 64, 16, 64);
            ctx.quadraticCurveTo(29, 64, 29, 55);
            ctx.lineTo(30, 38);
            // 右側身
            ctx.quadraticCurveTo(34, 18, 29, -4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 褲管線條細節
            ctx.beginPath();
            ctx.moveTo(-29, 49);
            ctx.quadraticCurveTo(-16, 52, -4, 49);
            ctx.moveTo(4, 49);
            ctx.quadraticCurveTo(16, 52, 29, 49);
            ctx.moveTo(-4, 43);
            ctx.quadraticCurveTo(0, 41, 4, 43);

            // 腿部淺色反光條

            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-25, 44);
            ctx.lineTo(-9, 45);
            ctx.moveTo(9, 45);
            ctx.lineTo(25, 44);
            ctx.stroke();

            // 胸前圓角矩形控制面板
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.8;
            ctx.fillStyle = suitColor;
            ctx.beginPath();
            ctx.roundRect(-16, 6, 32, 20, 6);
            ctx.fill();
            ctx.stroke();

            // --- 4. 太空頭盔外罩 ---
            ctx.fillStyle = suitColor;
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.ellipse(0, -28, 37, 34, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 領口環狀領圈
            ctx.beginPath();
            ctx.moveTo(-26, -4);
            ctx.quadraticCurveTo(0, 4, 26, -4);
            ctx.stroke();

            // --- 5. 頭盔面罩與可愛臉龐 ---
            ctx.fillStyle = skinColor;
            ctx.beginPath();
            ctx.ellipse(0, -25, 29, 24, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.beginPath();
            ctx.ellipse(0, -25, 29, 24, 0, 0, Math.PI * 2);
            ctx.clip();

            // 瀏海 (調整 Luna 瀏海為左右完全對稱置中)
            ctx.fillStyle = hairColor;
            ctx.beginPath();
            if (isPink) {
                ctx.arc(0, -26, 28.5, Math.PI * 1.03, Math.PI * 1.97);
                ctx.quadraticCurveTo(18, -31, 8, -37);
                ctx.quadraticCurveTo(0, -31, -8, -37);
                ctx.quadraticCurveTo(-18, -31, -28.3, -28.6);
            } else {
                ctx.arc(0, -26, 28.5, Math.PI * 1.03, Math.PI * 1.97);
                ctx.quadraticCurveTo(20, -33, 14, -37);
                ctx.quadraticCurveTo(7, -32, 0, -37);
                ctx.quadraticCurveTo(-7, -32, -14, -37);
                ctx.quadraticCurveTo(-20, -33, -28.2, -28);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // 重新描繪頭盔面罩外框線條
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.ellipse(0, -25, 29, 24, 0, 0, Math.PI * 2);
            ctx.stroke();

            // 腮紅
            ctx.fillStyle = cheekColor;
            ctx.beginPath();
            ctx.ellipse(-16, -20, 4.5, 3, 0, 0, Math.PI * 2);
            ctx.ellipse(16, -20, 4.5, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // 面罩玻璃白色高光弧線
            ctx.strokeStyle = lerpHexColor('#ffffff', '#9ea2b0', darkenPct);
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            if (isPink) {
                ctx.ellipse(0, -25, 25, 20.5, 0, Math.PI * 0.96, Math.PI * 1.15);
            } else {
                ctx.ellipse(0, -25, 25, 20.5, 0, Math.PI * 1.85, Math.PI * 0.04);
            }
            ctx.stroke();

            // 表情
            ctx.strokeStyle = strokeColor;
            ctx.fillStyle = strokeColor;
            ctx.lineWidth = 2.6;

            if (astro.alive) {
                const isScaredFace = astro.hp === 1 || astro.sadPartnerTimer > 0 || astro.hurtTimer > 0 || (astro.partnerLost && astro.hp < astro.maxHp);
                const isHappyFace = astro.happyTimer > 0 || astro.buddyHappy;
                if (isScaredFace) {
                    // ＞_＜ 表情
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.moveTo(-14, -26.5);
                    ctx.lineTo(-9.5, -24);
                    ctx.lineTo(-14, -21.5);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(14, -26.5);
                    ctx.lineTo(9.5, -24);
                    ctx.lineTo(14, -21.5);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, -22, 2.2, Math.PI * 1.1, Math.PI * 1.9);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(-4.5, -16.5);
                    ctx.quadraticCurveTo(0, -17.5, 4.5, -16.5);
                    ctx.stroke();
                } else {
                    if (isHappyFace) {
                        ctx.beginPath();
                        ctx.arc(-11, -23, 3.2, Math.PI, 0);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(11, -23, 3.2, Math.PI, 0);
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        ctx.ellipse(-11, -24, 1.8, 2.5, 0, 0, Math.PI * 2);
                        ctx.ellipse(11, -24, 1.8, 2.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.beginPath();
                    ctx.arc(0, -22, 2.2, Math.PI * 1.1, Math.PI * 1.9);
                    ctx.stroke();

                    ctx.beginPath();
                    if (isHappyFace) {
                        ctx.fillStyle = '#c49a76';
                        ctx.arc(0, -17.5, 4.2, 0, Math.PI);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    } else {
                        ctx.arc(0, -18, 4.5, 0.15 * Math.PI, 0.85 * Math.PI);
                        ctx.stroke();

                }
            } else {
                // 耗盡生命時的 X X 暈眩眼與難過小嘴
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(-14, -27);
                ctx.lineTo(-9, -22);
                ctx.moveTo(-9, -27);
                ctx.lineTo(-14, -22);
                ctx.moveTo(9, -27);
                ctx.lineTo(14, -22);
                ctx.moveTo(14, -27);
                ctx.lineTo(9, -22);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, -14, 4, 1.15 * Math.PI, 1.85 * Math.PI);

            // --- 6. Luna 頭頂右側粉色蝴蝶結 ---
            if (isPink) {
                ctx.save();
                ctx.translate(23, -44);
                ctx.rotate(0.28);
                ctx.fillStyle = bowColor;
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2.6;

                ctx.beginPath();
                ctx.moveTo(-2, 0);
                ctx.quadraticCurveTo(-13, -8, -12, 0);
                ctx.quadraticCurveTo(-13, 8, -2, 0);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(2, 0);
                ctx.quadraticCurveTo(13, -8, 12, 0);
                ctx.quadraticCurveTo(13, 8, 2, 0);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.roundRect(-3.5, -3.5, 7, 7, 2.5);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

            ctx.restore();

        // ==========================================
        // 3. 遊戲核心狀態與物理邏輯
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        let dpr = Math.min(window.devicePixelRatio || 1, 2);

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (previewCanvas) {
                const rect = previewCanvas.getBoundingClientRect();
                if (rect.width > 0 && rect.height > 0) {
                    previewCanvas.width = rect.width * dpr;
                    previewCanvas.height = rect.height * dpr;
                    previewCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
            }
        }
        window.addEventListener('resize', resizeCanvas);

        // 本地永久存檔管理 (localStorage)
        const STORAGE_KEY = 'space_float_demo_best_score_v1';

            try {

                return 0;
            }
        }

        // 遊戲狀態變數

        function spawnParticles(x, y, color, count = 14, speed = 160) {

        // ==========================================
        // 4. 障礙物與回血道具生成
        // ==========================================
        function spawnObstacle() {
            const margin = 35;
            const x = margin + Math.random() * (width - margin * 2);
            const r = Math.random() * 16 + 18;
            const types = ['meteor', 'meteor', 'satellite', 'scrap'];
            const type = types[Math.floor(Math.random() * types.length)];

            const vertices = [];
            const numVerts = 9;
            for (let i = 0; i < numVerts; i++) {
                const ang = (i / numVerts) * Math.PI * 2;
                const dist = r * (0.8 + Math.random() * 0.32);
                vertices.push({ x: Math.cos(ang) * dist, y: Math.sin(ang) * dist });
            }

            const baseSpeed = (165 + Math.random() * 95) * (1 + (difficulty - 1) * 0.22);
            const vx = (Math.random() - 0.5) * 75 * difficulty;

            obstacles.push({
                x,
                y: -r - 20,
                vx,
                vy: baseSpeed,
                radius: r * 0.85,
                visualRadius: r,
                type,
                vertices,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 3.2
            });
        }

        function spawnHealItem() {
            const margin = 45;

        function drawObstacle(ctx, obs) {
            ctx.save();
            ctx.translate(obs.x, obs.y);
            ctx.rotate(obs.rotation);

            if (obs.type === 'meteor') {
                const grad = ctx.createRadialGradient(-obs.visualRadius * 0.3, -obs.visualRadius * 0.3, 4, 0, 0, obs.visualRadius);
                grad.addColorStop(0, '#9a8c98');
                grad.addColorStop(0.6, '#5c5470');
                grad.addColorStop(1, '#352f44');

                ctx.fillStyle = grad;
                ctx.strokeStyle = '#b8b8d1';
                ctx.lineWidth = 2;

                ctx.beginPath();
                obs.vertices.forEach((v, idx) => {
                    if (idx === 0) ctx.moveTo(v.x, v.y);
                    else ctx.lineTo(v.x, v.y);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(28, 25, 40, 0.55)';
                ctx.beginPath();
                ctx.arc(-obs.visualRadius * 0.25, -obs.visualRadius * 0.15, obs.visualRadius * 0.22, 0, Math.PI * 2);
                ctx.arc(obs.visualRadius * 0.28, obs.visualRadius * 0.22, obs.visualRadius * 0.16, 0, Math.PI * 2);
                ctx.fill();
            } else if (obs.type === 'satellite') {
                const r = obs.visualRadius;
                ctx.fillStyle = '#3b82f6';
                ctx.strokeStyle = '#93c5fd';
                ctx.lineWidth = 1.8;
                ctx.fillRect(-r * 1.35, -r * 0.32, r * 2.7, r * 0.64);
                ctx.strokeRect(-r * 1.35, -r * 0.32, r * 2.7, r * 0.64);

                ctx.fillStyle = '#f59e0b';
                ctx.strokeStyle = '#fef3c7';
                ctx.beginPath();
                ctx.roundRect(-r * 0.5, -r * 0.55, r, r * 1.1, 6);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -r * 0.55);
                ctx.lineTo(0, -r * 0.95);
                ctx.stroke();
            } else {
                const r = obs.visualRadius;
                ctx.fillStyle = '#64748b';
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-r * 0.8, -r * 0.5);
                ctx.lineTo(r * 0.7, -r * 0.7);
                ctx.lineTo(r * 0.9, r * 0.4);
                ctx.lineTo(-r * 0.3, r * 0.8);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#fb7185';
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawHealItem(ctx, item) {

            const scale = 1 + Math.sin(item.pulse) * 0.12;

            const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 26);
            glow.addColorStop(0, 'rgba(255, 118, 168, 0.7)');
            glow.addColorStop(1, 'rgba(255, 118, 168, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, 26, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 240, 246, 0.94)';
            ctx.strokeStyle = '#ff75a0';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ff477e';
            ctx.beginPath();
            ctx.moveTo(0, 7.2);
            ctx.bezierCurveTo(-5, 4.5, -10.5, 0.5, -10.5, -3.5);
            ctx.arc(-5.25, -3.5, 5.25, Math.PI, 0, false);
            ctx.arc(5.25, -3.5, 5.25, Math.PI, 0, false);
            ctx.bezierCurveTo(10.5, 0.5, 5, 4.5, 0, 7.2);

            ctx.fill();

            ctx.restore();

        // ==========================================
        // 5. 多點觸控 & 滑鼠 & 鍵盤操控系統
        // ==========================================
        const activePointers = new Map();

        function handlePointerDown(e) {
            if (gameState !== 'PLAYING') return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;

            let bestAstro = null;
            let bestDist = Infinity;

            for (const astro of astronauts) {
                if (!astro.alive) continue;
                if (astro.pointerId !== null) continue;

                const d = Math.hypot(px - astro.x, py - astro.y);
                if (d < 140 && d < bestDist) {
                    bestDist = d;
                    bestAstro = astro;
                }
            }

            if (!bestAstro) {
                const preferPink = px < width * 0.5;
                const candidate = preferPink ? astronauts[0] : astronauts[1];
                const fallback = preferPink ? astronauts[1] : astronauts[0];

                if (candidate && candidate.alive && candidate.pointerId === null) {
                    bestAstro = candidate;
                } else if (fallback && fallback.alive && fallback.pointerId === null) {
                    bestAstro = fallback;
                }
            }

            if (bestAstro) {
                bestAstro.pointerId = e.pointerId;
                const touchLift = e.pointerType === 'touch' ? 58 : 0;
                const dist = Math.hypot(px - bestAstro.x, py - bestAstro.y);
                const useOffset = dist < 85;
                activePointers.set(e.pointerId, {
                    astro: bestAstro,
                    offsetX: useOffset ? bestAstro.x - px : 0,
                    offsetY: useOffset ? (bestAstro.y - py) - touchLift * 0.5 : -touchLift
                });
                const pad = 32;
                if (!useOffset) {
                    bestAstro.targetX = Math.max(pad, Math.min(width - pad, px));
                    bestAstro.targetY = Math.max(pad + 50, Math.min(height - pad, py - touchLift));
                } else if (touchLift > 0) {
                    bestAstro.targetY = Math.max(pad + 50, Math.min(height - pad, bestAstro.y - touchLift * 0.5));
                }
            }
        }

        function handlePointerMove(e) {
            if (gameState !== 'PLAYING') return;
            const binding = activePointers.get(e.pointerId);
            if (!binding) return;

            const astro = binding.astro;
            if (!astro.alive) {
                astro.pointerId = null;
                activePointers.delete(e.pointerId);
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;

            const pad = 32;
            astro.targetX = Math.max(pad, Math.min(width - pad, px + binding.offsetX));
            astro.targetY = Math.max(pad + 50, Math.min(height - pad, py + binding.offsetY));
        }

        function handlePointerUp(e) {
            const binding = activePointers.get(e.pointerId);
            if (binding) {
                binding.astro.pointerId = null;
                activePointers.delete(e.pointerId);
            }
        }

        canvas.addEventListener('pointerdown', handlePointerDown);
        canvas.addEventListener('pointermove', handlePointerMove);
        canvas.addEventListener('pointerup', handlePointerUp);
        canvas.addEventListener('pointercancel', handlePointerUp);

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function applyKeyboardControl(dt) {
            const moveSpeed = 360;
            const pad = 32;

            const pink = astronauts[0];
            if (pink && pink.alive && pink.pointerId === null) {
                if (keys['KeyA']) pink.targetX -= moveSpeed * dt;
                if (keys['KeyD']) pink.targetX += moveSpeed * dt;
                if (keys['KeyW']) pink.targetY -= moveSpeed * dt;
                if (keys['KeyS']) pink.targetY += moveSpeed * dt;
                pink.targetX = Math.max(pad, Math.min(width - pad, pink.targetX));
                pink.targetY = Math.max(pad + 50, Math.min(height - pad, pink.targetY));
            }

            const blue = astronauts[1];
            if (blue && blue.alive && blue.pointerId === null) {
                if (keys['ArrowLeft']) blue.targetX -= moveSpeed * dt;
                if (keys['ArrowRight']) blue.targetX += moveSpeed * dt;
                if (keys['ArrowUp']) blue.targetY -= moveSpeed * dt;
                if (keys['ArrowDown']) blue.targetY += moveSpeed * dt;
                blue.targetX = Math.max(pad, Math.min(width - pad, blue.targetX));
                blue.targetY = Math.max(pad + 50, Math.min(height - pad, blue.targetY));
            }
        }

        // ==========================================
        // 6. 遊戲主迴圈更新與碰撞判定
        // ==========================================
        function update(dt) {
            stars.forEach(s => {
                s.y += s.speed * (gameState === 'PLAYING' ? (1 + (difficulty - 1) * 0.3) : 0.4) * dt;
                s.twinkle += dt * 3;
                if (s.y > height) {
                    s.y = -5;
                    s.x = Math.random() * width;
                }
            });

            if (gameState !== 'PLAYING') return;

            distance += dt * 5 * (1 + (difficulty - 1) * 0.15);
            difficulty = 1 + Math.min(2.5, distance / 300);
            document.getElementById('scoreDisplay').textContent = `${Math.floor(distance)} m`;

            if (screenShake > 0) {
                screenShake = Math.max(0, screenShake - dt * 28);
            }

            applyKeyboardControl(dt);

            let anyAlive = false;
            for (const astro of astronauts) {
                astro.animTime += dt;

                if (astro.alive) {
                    anyAlive = true;
                    if (astro.invulnTimer > 0) astro.invulnTimer -= dt;
                    if (astro.happyTimer > 0) astro.happyTimer -= dt;
                    if (astro.hurtTimer > 0) astro.hurtTimer -= dt;
                    if (astro.sadPartnerTimer > 0) astro.sadPartnerTimer -= dt;

                    const lerpFactor = Math.min(1, dt * 14);
                    const prevX = astro.x;
                    const prevY = astro.y;
                    astro.x += (astro.targetX - astro.x) * lerpFactor;
                    astro.y += (astro.targetY - astro.y) * lerpFactor;
                    astro.vx = (astro.x - prevX) / Math.max(dt, 0.001);
                    astro.vy = (astro.y - prevY) / Math.max(dt, 0.001);

                    const baseSpinDir = astro.type === 'pink' ? 1 : -1;
                    const baseSpinSpeed = baseSpinDir * 0.75;
                    const moveSpinInfluence = Math.max(-3.2, Math.min(3.2, astro.vx * 0.005));
                    const targetAngularVel = baseSpinSpeed + moveSpinInfluence;
                    astro.angularVelocity += (targetAngularVel - astro.angularVelocity) * Math.min(1, dt * 8);
                    astro.currentAngle += astro.angularVelocity * dt;
                } else {
                    astro.grayProgress = Math.min(1, astro.grayProgress + dt * 1.6);
                    astro.fallVy += 380 * dt;
                    astro.y += astro.fallVy * dt;
                    astro.x += astro.fallVx * dt;
                    astro.fallRotation += astro.fallRotSpeed * dt;
                }
            }

            const allFallenOut = astronauts.every(a => !a.alive && a.y > height + 100);
            if (!anyAlive && allFallenOut) {
                triggerGameOver();
                return;
            }

            const luna = astronauts[0];
            const haru = astronauts[1];
            if (luna && haru && luna.alive && haru.alive) {
                const pairDist = Math.hypot(luna.x - haru.x, luna.y - haru.y);
                const closeThreshold = (luna.radius + haru.radius) * 1.95;
                if (pairDist <= closeThreshold) {
                    buddyCloseTime += dt;
                    if (buddyCloseTime >= 3.0) {
                        luna.buddyHappy = true;
                        haru.buddyHappy = true;
                        if (buddyCloseTime >= 4.0) {
                            buddyBonusTickTimer += dt;
                            if (buddyBonusTickTimer >= 1.0) {
                                buddyBonusTickTimer -= 1.0;
                                distance += 10;
                                const midX = (luna.x + haru.x) * 0.5;
                                const midY = Math.min(luna.y, haru.y) - 42;
                                spawnFloatingText(midX, midY, 'Bonus +10m', '#ffe66d');
                            }
                        }
                    }
                } else {
                    buddyCloseTime = 0;
                    buddyBonusTickTimer = 0;
                    luna.buddyHappy = false;
                    haru.buddyHappy = false;
                }
            } else {
                buddyCloseTime = 0;
                buddyBonusTickTimer = 0;
                if (luna) luna.buddyHappy = false;
                if (haru) haru.buddyHappy = false;
            }

            obstacleTimer -= dt;
            if (obstacleTimer <= 0) {
                spawnObstacle();
                obstacleTimer = Math.max(0.32, (0.95 / difficulty) + Math.random() * 0.35);
            }

            itemTimer -= dt;
            if (itemTimer <= 0) {
                spawnHealItem();
                itemTimer = 7.5 + Math.random() * 4.5;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x += obs.vx * dt;
                obs.y += obs.vy * dt;
                obs.rotation += obs.rotSpeed * dt;

                if (obs.x < obs.visualRadius || obs.x > width - obs.visualRadius) {
                    obs.vx *= -1;
                }

                let hit = false;
                for (const astro of astronauts) {
                    if (!astro.alive || astro.invulnTimer > 0) continue;

                    const dist = Math.hypot(obs.x - astro.x, obs.y - astro.y);
                    if (dist < obs.radius + astro.radius * 0.78) {
                        hit = true;
                        handleAstroHit(astro, obs.x, obs.y);
                        break;
                    }
                }

                if (hit || obs.y > height + 60) {
                    obstacles.splice(i, 1);
                }
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.vy * dt;
                item.pulse += dt * 6;

                let collected = false;
                for (const astro of astronauts) {
                    if (!astro.alive) continue;

                    const dist = Math.hypot(item.x - astro.x, item.y - astro.y);
                    if (dist < item.radius + astro.radius) {
                        collected = true;
                        handleAstroHeal(astro);
                        break;
                    }
                }

                if (collected || item.y > height + 50) {
                    items.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= p.decay * dt;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 38 * dt;
                ft.life -= dt;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }
        }

        function handleAstroHit(astro, hitX, hitY) {
            buddyCloseTime = 0;
            buddyBonusTickTimer = 0;
            for (const a of astronauts) {
                a.buddyHappy = false;
            }

            astro.hp = Math.max(0, astro.hp - 1);
            astro.invulnTimer = 1.4;
            screenShake = 10;

            const isPink = astro.type === 'pink';
            const mainColor = isPink ? '#fbb6d3' : '#b9dcfa';
            const lightColor = isPink ? '#ffd4e6' : '#dcf0ff';
            spawnParticles(hitX, hitY, mainColor, 16, 180);
            spawnParticles(astro.x, astro.y, lightColor, 10, 120);
            updateHeartsUI();

            if (astro.hp <= 0) {
                astro.alive = false;
                astro.fallRotation = astro.currentAngle || 0;
                astro.fallRotSpeed = astro.type === 'pink' ? -1.4 : 1.4;
                astro.fallVy = -90;
                if (astro.pointerId !== null) {
                    activePointers.delete(astro.pointerId);
                    astro.pointerId = null;
                }

                const alivePartners = astronauts.filter(other => other.id !== astro.id && other.alive);
                const isFirstDown = alivePartners.length > 0;

                for (const other of alivePartners) {
                    other.partnerLost = true;
                    other.sadPartnerTimer = 60.0;
                }

                sound.playFall();
                if (isFirstDown) {
                    spawnFloatingText(astro.x, astro.y - 30, `${astro.name} Down!`, '#cbd5e1');
                }
            } else {
                astro.hurtTimer = 3.0;
                sound.playHit();
                spawnFloatingText(astro.x, astro.y - 30, 'Ouch!', '#ff6b81');
            }
        }

        function handleAstroHeal(astro) {
            sound.playHeal();
            astro.happyTimer = 1.2;
            spawnParticles(astro.x, astro.y, '#ff75a0', 18, 150);

            if (astro.hp < astro.maxHp) {
                astro.hp += 1;
                updateHeartsUI();
                const upColor = astro.type === 'pink' ? '#fbb6d3' : '#b9dcfa';
                spawnFloatingText(astro.x, astro.y - 35, `${astro.name} 1UP`, upColor);
            } else {
                distance += 35;
                spawnFloatingText(astro.x, astro.y - 35, 'Bonus +35m', '#ffe66d');
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            const finalM = Math.floor(distance);
            if (finalM > bestDistance) {
                bestDistance = finalM;
                saveBestScore(bestDistance);
            }

            document.getElementById('finalScore').textContent = `${finalM} m`;
            document.getElementById('bestScore').textContent = `${bestDistance} m`;
            document.getElementById('hudLayer').classList.add('hidden');
            document.getElementById('topControls').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        // ==========================================
        // 7. 畫面渲染管線
        // ==========================================
        function draw() {
            ctx.save();

            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#070913');
            bgGrad.addColorStop(0.5, '#0e1329');
            bgGrad.addColorStop(1, '#141936');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            nebulas.forEach(n => {
                const rad = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.r);
                rad.addColorStop(0, n.color);
                rad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = rad;
                ctx.fillRect(0, 0, width, height);
            });

            stars.forEach(s => {
                const twinkleAlpha = s.alpha * (0.65 + 0.35 * Math.sin(s.twinkle));
                ctx.fillStyle = `rgba(255, 255, 255, ${twinkleAlpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake;
                const sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
            }

            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                if (astronauts[0] && astronauts[1] && astronauts[0].alive && astronauts[1].alive) {
                    const grad = ctx.createLinearGradient(astronauts[0].x, astronauts[0].y, astronauts[1].x, astronauts[1].y);
                    grad.addColorStop(0, 'rgba(251, 182, 211, 0.22)');
                    grad.addColorStop(1, 'rgba(185, 220, 250, 0.22)');
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 8]);
                    ctx.beginPath();
                    ctx.moveTo(astronauts[0].x, astronauts[0].y);
                    ctx.lineTo(astronauts[1].x, astronauts[1].y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                items.forEach(item => drawHealItem(ctx, item));
                obstacles.forEach(obs => drawObstacle(ctx, obs));

                astronauts.forEach(astro => {
                    if (astro.alive && astro.pointerId !== null) {
                        ctx.save();
                        ctx.strokeStyle = astro.type === 'pink' ? 'rgba(251, 182, 211, 0.45)' : 'rgba(185, 220, 250, 0.45)';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.arc(astro.x, astro.y, astro.radius * 1.45, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.restore();
                    }
                    drawAstronaut(ctx, astro);
                });

                particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                floatingTexts.forEach(ft => {
                    ctx.save();
                    ctx.globalAlpha = Math.min(1, ft.life);
                    ctx.font = 'bold 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = ft.color;
                    ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.shadowBlur = 6;
                    ctx.fillText(ft.text, ft.x, ft.y);
                    ctx.restore();
                });
            }

            ctx.restore();
        }

        let previewTime = 0;
        function drawStartPreview(dt) {
            if (gameState !== 'START') return;
            const rect = previewCanvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            previewTime += dt;
            const pw = rect.width;
            const ph = rect.height;

            previewCtx.clearRect(0, 0, pw, ph);

            const previewScale = 0.88;
            const halfGap = Math.max(pw * 0.175, 52 * previewScale);

            const pinkPreview = {
                type: 'pink',
                x: pw * 0.5 - halfGap,
                y: ph * 0.54 + Math.sin(previewTime * 2.5) * 6,
                vx: 0,
                currentAngle: Math.sin(previewTime * 2.2) * 0.11,
                scale: previewScale,
                alive: true,
                invulnTimer: 0,
                happyTimer: 1,
                hurtTimer: 0,
                sadPartnerTimer: 0,
                partnerLost: false,
                animTime: previewTime,
                phaseOffset: 0
            };

            const bluePreview = {
                type: 'blue',
                x: pw * 0.5 + halfGap,
                y: ph * 0.54 + Math.cos(previewTime * 2.5) * 6,
                vx: 0,
                currentAngle: Math.sin(previewTime * 2.2 + 1.5) * 0.11,
                scale: previewScale,
                alive: true,
                invulnTimer: 0,
                happyTimer: 1,
                hurtTimer: 0,
                sadPartnerTimer: 0,
                partnerLost: false,
                animTime: previewTime,
                phaseOffset: 1.5
            };

            drawAstronaut(previewCtx, pinkPreview);
            drawAstronaut(previewCtx, bluePreview);
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
            lastTime = timestamp;

            update(dt);
            draw();
            drawStartPreview(dt);

            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // 8. UI 按鈕事件綁定
        // ==========================================
        async function startGameFlow() {
            await sound.init();
            sound.playStart();
            resetGame();
            gameState = 'PLAYING';

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hudLayer').classList.remove('hidden');
            document.getElementById('topControls').classList.remove('hidden');
        }

        document.getElementById('startBtn').addEventListener('click', startGameFlow);
        document.getElementById('restartBtn').addEventListener('click', startGameFlow);
        document.getElementById('homeBtn').addEventListener('click', () => {
            gameState = 'START';
            obstacles = [];
            items = [];
            particles = [];
            floatingTexts = [];
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hudLayer').classList.add('hidden');
            document.getElementById('topControls').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        });

        document.getElementById('soundToggleBtn').addEventListener('click', async () => {
            await sound.init();
            sound.enabled = !sound.enabled;
            document.getElementById('soundToggleBtn').textContent = sound.enabled ? '🔊' : '🔇';
        });

        window.onload = function () {
            resizeCanvas();
            initBackground();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
